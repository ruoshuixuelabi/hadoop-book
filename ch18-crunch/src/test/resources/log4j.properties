# =====================================================
# Log4j 日志配置文件： Crunch 测试环境
# =====================================================
# 文件说明:
#   本配置文件用于配置 Crunch 库和 Hadoop 的日志输出级别和格式。
#   主要用于 Crunch 测试代码的日志管理。
#
# 日志级别说明:
#   - DEBUG: 详细调试信息
#   - INFO: 一般信息性消息
#   - WARN: 警告信息
#   - ERROR: 错误信息
#
# 配置说明:
#   - Crunch 库日志级别设为 INFO，输出到控制台
#   - Hadoop 日志级别设为 INFO，但 Configuration 类设为 ERROR（避免过多配置信息）
#   - 使用 ConsoleAppender 将日志输出到标准输出/错误流
#
# 使用场景:
#   - 运行 Crunch 单元测试时
#   - 本地开发调试 Crunch 程序
#   - 验证 Crunch Pipeline 执行过程
# =====================================================

# =====================================================
# Crunch 库日志配置
# =====================================================
# 将 Crunch 库的日志级别设为 INFO，输出到控制台Appender
# Crunch 会输出 Pipeline 执行过程、阶段信息等
log4j.logger.org.apache.crunch=info, A

# =====================================================
# Hadoop 日志配置
# =====================================================
# Hadoop 库日志级别设为 INFO，输出到控制台
# 包括 MapReduce 任务执行、HDFS 操作等信息
log4j.logger.org.apache.hadoop=info, A

# Configuration 类日志级别设为 ERROR
# Configuration 在初始化时会输出大量调试信息
# 设为 ERROR 可以避免这些冗余信息干扰测试输出
log4j.logger.org.apache.hadoop.conf.Configuration=error, A

# =====================================================
# Appender 配置 (A - 控制台输出)
# =====================================================
# Appender 类型: ConsoleAppender - 将日志输出到控制台
log4j.appender.A=org.apache.log4j.ConsoleAppender

# 日志布局类型: PatternLayout - 使用模式字符串自定义格式
log4j.appender.A.layout=org.apache.log4j.PatternLayout

# 日志格式模式说明:
# %-4r: 相对时间（毫秒），左对齐，宽度4
# [%t]: 线程名称
# %-5p: 日志级别，左对齐，宽度5
# %c: 日志来源类别
# %x: NDC（嵌套诊断上下文）
# %m: 日志消息
# %n: 换行符
log4j.appender.A.layout.ConversionPattern=%-4r [%t] %-5p %c %x - %m%n
