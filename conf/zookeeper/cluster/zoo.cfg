# 这是一份 ZooKeeper 三节点集群配置：奇数个节点可以容忍一半节点故障后集群仍然可用
# 集群里每台机器都要有一份内容相同的这份配置，彼此靠下面的 server.N 列表互相发现
# 每个节点还要在自己的 dataDir 下放一个只写自己编号的 myid 文件，用来标识身份
# 心跳间隔，同时也是后面两个超时值的计时单位，取毫秒
# 官方推荐 2000；调得过大故障发现变慢，调得过小则网络抖动就会被误判成节点失联
tickTime=2000
# 快照等元数据的存放目录，应放在容量大且读写性能好的独立磁盘上
dataDir=/disk1/zookeeper
# 事务日志单独放一个目录，是为了把随机写密集的日志和快照分开，减轻同一块盘的争用
dataLogDir=/disk2/zookeeper
# 客户端连接 ZooKeeper 的端口，必须与运维约定的对外端口一致
clientPort=2181
# 这里限制的是 follower 首次连接 leader 并把数据同步完的最长时间，以 tick 为单位
# 节点多、数据多时同步可能很慢，5 个 tick 不够就要调大，否则集群根本起不来
initLimit=5
# 这个值限制的是 follower 与 leader 失去同步后允许再同步的最长时间，同样以 tick 为单位
# 这个值要明显小于客户端的会话超时，否则客户端会先于集群自愈而放弃请求
syncLimit=2
# 每个节点的编号与地址列表，冒号后的两个端口分别是 follower 同步 leader 的端口和选举时用的通信端口
server.1=zookeeper1:2888:3888
server.2=zookeeper2:2888:3888
server.3=zookeeper3:2888:3888
