#
# ZooKeeper 日志配置
#
# 此文件配置ZooKeeper服务的日志输出行为。
# ZooKeeper使用Log4j作为日志框架，支持多种日志输出方式（控制台、文件、滚动文件等）。
#
# 日志格式说明：
# "<默认日志级别> (, <appender名称>)+"
# 例如：log4j.rootLogger=INFO, CONSOLE, ROLLINGFILE
#
# 日志级别优先级：TRACE < DEBUG < INFO < WARN < ERROR < FATAL

#==================================================
# 根日志记录器配置
#==================================================

# 默认配置：仅控制台输出
#log4j.rootLogger=INFO, CONSOLE

# 当前配置：INFO级别及以上日志输出到滚动文件
log4j.rootLogger=INFO, ROLLINGFILE

# 调试配置示例：包含控制台和滚动文件（调试级别）
#log4j.rootLogger=DEBUG, CONSOLE, ROLLINGFILE

# 跟踪配置示例：包含控制台、滚动文件和跟踪文件（跟踪级别）
#log4j.rootLogger=TRACE, CONSOLE, ROLLINGFILE, TRACEFILE

#==================================================
# 控制台日志Appender配置
#==================================================
# Appender：日志输出目的地，这里配置控制台输出

# 日志输出到控制台（System.err）
log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
# 设置控制台日志级别阈值为INFO，低于此级别的日志不会输出
log4j.appender.CONSOLE.Threshold=INFO
# 使用PatternLayout自定义日志格式
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
# 日志格式：时间 - 日志级别 [线程名:类名@行号] - 消息
# %d{ISO8601}: ISO8601格式的时间戳
# %-5p: 左对齐的日志级别
# %t: 线程名
# %C{1}: 调用日志的类名（简短格式）
# %L: 行号
# %m: 日志消息
# %n: 换行符
log4j.appender.CONSOLE.layout.ConversionPattern=%d{ISO8601} - %-5p [%t:%C{1}@%L] - %m%n

#==================================================
# 滚动文件日志Appender配置
#==================================================
# 滚动文件Appender：当日志文件达到指定大小后自动滚动备份

# 添加ROLLINGFILE到rootLogger以输出日志到文件
# 日志级别设为DEBUG，会记录调试及以上级别的消息
log4j.appender.ROLLINGFILE=org.apache.log4j.RollingFileAppender
log4j.appender.ROLLINGFILE.Threshold=DEBUG
# 日志输出到zookeeper.log文件
log4j.appender.ROLLINGFILE.File=zookeeper.log

# 单个日志文件最大容量：10MB
# 当日志文件达到此大小后会触发滚动
log4j.appender.ROLLINGFILE.MaxFileSize=10MB
# 备份文件数量上限（注释掉表示不限制）
# 超过此数量的旧备份文件会被删除
#log4j.appender.ROLLINGFILE.MaxBackupIndex=10

# 滚动文件的日志格式
log4j.appender.ROLLINGFILE.layout=org.apache.log4j.PatternLayout
log4j.appender.ROLLINGFILE.layout.ConversionPattern=%d{ISO8601} - %-5p [%t:%C{1}@%L] - %m%n

#==================================================
# 跟踪文件日志Appender配置
#==================================================
# 跟踪文件Appender：记录最详细的日志信息，用于深度调试

# 添加TRACEFILE到rootLogger以获取跟踪日志
# 记录TRACE级别及以上的所有消息
log4j.appender.TRACEFILE=org.apache.log4j.FileAppender
log4j.appender.TRACEFILE.Threshold=TRACE
# 跟踪日志输出到zookeeper_trace.log文件
log4j.appender.TRACEFILE.File=zookeeper_trace.log

# 跟踪日志格式
log4j.appender.TRACEFILE.layout=org.apache.log4j.PatternLayout
# 注意：这里包含了NDC（嵌套诊断上下文）信息 %x
log4j.appender.TRACEFILE.layout.ConversionPattern=%d{ISO8601} - %-5p [%t:%C{1}@%L][%x] - %m%n
