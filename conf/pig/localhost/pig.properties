# Pig本地模式配置文件
#
# 此配置文件用于Pig在本地模式下运行，数据处理在本地文件系统进行。
# 本地模式适合开发调试，数据不需要上传到HDFS。
#
# 适用场景：
# - 开发和测试Pig Latin脚本
# - 处理小数据集
# - 不需要完整Hadoop集群环境

# HDFS默认文件系统地址
# fs.defaultFS: 指定Pig使用的HDFS文件系统地址
# 设为hdfs://localhost/表示使用本地HDFS服务
fs.defaultFS=hdfs://localhost/

# MapReduce JobTracker地址
# mapred.job.tracker: 指定MapReduce作业的JobTracker地址和端口
# 本地模式下通常设为localhost:8021
# 注意：这是MapReduce 1.x的配置，Pig在执行MapReduce作业时会使用
mapred.job.tracker=localhost:8021
