# 这份文件是 Pig 客户端要用的 Hadoop 配置：文件系统和作业提交地址都指向本机的伪分布式集群
# 客户端本身不带文件系统实现，Pig 复用的是 Hadoop 的 FileSystem 抽象，
# 所以这里的 fs.defaultFS 必须与 core-site.xml 中的取值一致，
# 否则同一个路径在 Pig 和 Hadoop 命令行里会指向两份不同的数据
fs.defaultFS=hdfs://localhost/
# 作业追踪器地址，8021 是 JobTracker 的 RPC 端口
# 这是 Hadoop 1.x 时代的属性名，在 YARN 集群上作业实际由 ResourceManager 调度，
# 对应的属性是 yarn.resourcemanager.address，保留旧写法是为了与书中早期章节的 Pig 示例保持一致
mapred.job.tracker=localhost:8021