# Oozie工作流作业提交配置文件
#
# 此文件用于提交Oozie工作流作业，不作为工作流应用的一部分打包。
# Oozie是一个工作流调度系统，用于协调Hadoop上的复杂作业。
#
# 使用方式：
# 将此文件复制到提交节点，修改相应配置后使用oozie命令提交
#
# 关键配置说明：
# - nameNode: HDFS NameNode地址，工作流应用部署在该HDFS上
# - resourceManager: YARN ResourceManager地址，用于运行MapReduce作业
# - oozie.wf.application.path: 工作流应用在HDFS上的路径

# HDFS NameNode地址
# 指定HDFS集群的NameNode主机名和端口
# 工作流中需要访问的所有HDFS文件都在此文件系统上
nameNode=hdfs://localhost:8020

# YARN ResourceManager地址
# 指定ResourceManager的主机名和端口
# 用于提交和运行MapReduce作业
resourceManager=localhost:8032

# Oozie工作流应用路径
# ${nameNode}会被替换为上面定义的HDFS地址
# ${user.name}会被替换为当前提交作业的用户名
# 工作流定义文件(workflow.xml)就存储在这个路径下
oozie.wf.application.path=${nameNode}/user/${user.name}/max-temp-workflow
