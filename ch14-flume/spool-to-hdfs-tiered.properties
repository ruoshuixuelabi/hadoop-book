# First tier agent

# 这个变体把基准版拆成了两级：第一级只管接收和转发，第二级才落地到 HDFS。
# 为什么要拆两级？因为第一级可以放在靠近数据产生地的地方，
# 它只做「收下并缓存」这一件事，不受 HDFS 写入速度的拖累；
# 后面再由一台（或一组）机器上的第二级集中写入 HDFS，
# 这样即使 HDFS 写得慢，接收端也不会被拖住，数据只是先堆在第一级的通道里。
# 两级之间用 Avro 事件格式传递，所以第一级和第二级可以各自独立部署、独立重启。
#
# 第一级代理：spooldir 收文件，avro 汇把事件转发给第二级。
agent1.sources = source1
agent1.sinks = sink1
agent1.channels = channel1

agent1.sources.source1.channels = channel1
agent1.sinks.sink1.channel = channel1

agent1.sources.source1.type = spooldir
agent1.sources.source1.spoolDir = /tmp/spooldir

# 汇不再是 hdfs 而是 avro：它把事件按 Avro 格式打包后通过网络发给对端，
# 由第二级的 avro 源接收，作用相当于两个代理之间的传输管道。
agent1.sinks.sink1.type = avro
agent1.sinks.sink1.hostname = localhost
agent1.sinks.sink1.port = 10000

agent1.channels.channel1.type = file
# 基准版没写这两项，是因为 file 通道有默认位置：用户主目录下的 .flume/file-channel。
# 分成两级以后每个代理都要能独立重启，就必须把检查点目录和数据目录指到明确的位置，
# 否则两个代理会用同一份默认目录，重启后彼此的数据就搅在一起了。
# 通道的 checkpointDir 存的是消费进度，重启后靠它知道该从哪里接着读；
# 而 dataDirs 才是真正存放事件数据的地方。
agent1.channels.channel1.checkpointDir=/tmp/agent1/file-channel/checkpoint
agent1.channels.channel1.dataDirs=/tmp/agent1/file-channel/data

# Second tier agent

# 第二级代理：avro 源接第一级送来的事件，hdfs 汇把它们落到 HDFS。
# 这里的 hdfs 汇参数照搬基准版，只是少了基准版里那条 inUsePrefix：
# 基准版要演示「临时文件与正式文件如何区分」，这一级没有这个教学重点，就不再重复。
agent2.sources = source2
agent2.sinks = sink2
agent2.channels = channel2

agent2.sources.source2.channels = channel2
agent2.sinks.sink2.channel = channel2

agent2.sources.source2.type = avro
# 监听地址 bind 限制只监听本机回环地址：这个端口是给同一台机器上的第一级用的，
# 不该暴露到网络上被别人连上。
agent2.sources.source2.bind = localhost
# 端口必须和第一级 avro 汇里写的那个对上，否则两边根本连不起来。
agent2.sources.source2.port = 10000

agent2.sinks.sink2.type = hdfs
agent2.sinks.sink2.hdfs.path = /tmp/flume
agent2.sinks.sink2.hdfs.filePrefix = events
agent2.sinks.sink2.hdfs.fileSuffix = .log
agent2.sinks.sink2.hdfs.fileType = DataStream

agent2.channels.channel2.type = file
agent2.channels.channel2.checkpointDir=/tmp/agent2/file-channel/checkpoint
agent2.channels.channel2.dataDirs=/tmp/agent2/file-channel/data