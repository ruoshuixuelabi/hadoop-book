# =====================================================
# Apache Flume 配置文件： spool-to-hdfs-avro
# =====================================================
# 文件说明:
#   本配置文件定义了一个带时间戳拦截器的 Flume Agent。
#   与 spool-to-hdfs.properties 的主要区别是添加了 timestamp 拦截器，
#   用于在事件头中添加时间戳信息，实现基于时间的数据分区。
#
# 工作流程:
#   1. Source (source1): 监控 /tmp/spooldir 目录，检测新文件
#   2. Interceptor: 添加 timestamp 拦截器，为每个事件添加时间戳头
#   3. Channel (channel1): 使用 File Channel 暂存事件
#   4. Sink (sink1): 使用时间戳变量动态构建 HDFS 路径，实现自动分区
#
# 时间分区优势:
#   - 按 年/月/日 自动创建 HDFS 目录结构
#   - 便于数据生命周期管理和查询优化
#   - 支持时间序列数据的高效分析
#
# 配置架构:
#   - Agent 名称: agent1
#   - 组件类型: spooldir source + timestamp interceptor -> file channel -> hdfs sink
# =====================================================

# =====================================================
# Agent 基础配置
# =====================================================
agent1.sources = source1
agent1.sinks = sink1
agent1.channels = channel1

# =====================================================
# Source 配置 (source1)
# =====================================================
agent1.sources.source1.channels = channel1
agent1.sinks.sink1.channel = channel1

# Source 类型: spooldir - 监控目录中的新文件
agent1.sources.source1.type = spooldir

# 监控的目录路径
agent1.sources.source1.spoolDir = /tmp/spooldir

# =====================================================
# 拦截器配置 (interceptor1)
# =====================================================
# 拦截器名称
agent1.sources.source1.interceptors = interceptor1

# 拦截器类型: timestamp - 在事件头中添加时间戳
# 时间戳将用于 HDFS 路径中的时间变量替换 (year=%Y/month=%m/day=%d)
agent1.sources.source1.interceptors.interceptor1.type = timestamp

# =====================================================
# Sink 配置 (sink1)
# =====================================================
agent1.sinks.sink1.type = hdfs

# HDFS 路径使用时间变量 - 自动按 年/月/日 分区
# %Y: 四位年份, %m: 两位月份, %d: 两位日期
agent1.sinks.sink1.hdfs.path = /tmp/flume/year=%Y/month=%m/day=%d

# 写入 HDFS 的文件前缀
agent1.sinks.sink1.hdfs.filePrefix = events

# 写入 HDFS 的文件后缀
agent1.sinks.sink1.hdfs.fileSuffix = .log

# HDFS 文件类型: DataStream
agent1.sinks.sink1.hdfs.fileType = DataStream

# =====================================================
# Channel 配置 (channel1)
# =====================================================
# Channel 类型: file - 可靠的文件 Channel
agent1.channels.channel1.type = file
