# 这个变体在基准版的基础上换掉了写出格式：
# 不再把原始文本直接扔进 HDFS，而是先按 Avro 的事件格式序列化再写。
# 好处是 Avro 的容器文件把 schema 一起写进了文件头，
# 下游读的时候不必再靠约定去猜结构，写入端和读取端因此不会互相绑死。
# 要注意的是这里的 schema 是 Flume 自己定死的事件结构（头部键值表加事件体），
# 不是用户自定义的 schema，也就是说它换掉的是「裸文本」这种约定俗成的格式，而不是可自定义的结构。
agent1.sources = source1
agent1.sinks = sink1
agent1.channels = channel1

agent1.sources.source1.channels = channel1
agent1.sinks.sink1.channel = channel1

agent1.sources.source1.type = spooldir
agent1.sources.source1.spoolDir = /tmp/spooldir

agent1.sinks.sink1.type = hdfs
agent1.sinks.sink1.hdfs.path = /tmp/flume
agent1.sinks.sink1.hdfs.filePrefix = events
# 后缀改成 .avro，让下游一眼看出这个文件不是普通文本。
agent1.sinks.sink1.hdfs.fileSuffix = .avro
agent1.sinks.sink1.hdfs.fileType = DataStream
# 序列化器 serializer 指定用 Avro 的事件序列化器，这是与基准版最实质的一处改动。
# 注意这个选项不属于 hdfs.* 那一族，它是 DataStream 这种文件类型自己用的序列化器设置。
agent1.sinks.sink1.serializer = avro_event
# 再指定压缩算法为 snappy：Avro 的容器文件本身支持按块压缩，
# 而 snappy 压缩比不高但速度很快，适合日志这类写多读少的场景。
# 这个键同样挂在 serializer. 下面，而且要和上面的 avro_event 配对使用才生效。
agent1.sinks.sink1.serializer.compressionCodec = snappy

agent1.channels.channel1.type = file
