# =====================================================
# Apache Flume 配置文件： spool-to-hdfs
# =====================================================
# 文件说明:
#   本配置文件定义了一个单节点的 Flume Agent，用于监控指定目录（spooldir）中的新文件，
#   并将文件内容以 Avro 格式写入 HDFS。
#
# 工作流程:
#   1. Source (source1): 监控 /tmp/spooldir 目录，检测新文件并读取内容
#   2. Channel (channel1): 使用 File Channel 暂存事件，确保数据可靠性
#   3. Sink (sink1): 从 Channel 消费事件，以 Avro 格式写入 HDFS
#
# 配置架构:
#   - Agent 名称: agent1
#   - 组件类型: spooldir source -> file channel -> hdfs sink
#   - 数据格式: Avro (使用 snappy 压缩)
#
# 使用方式:
#   $ flume-ng agent -n agent1 -f spool-to-hdfs.properties
# =====================================================

# =====================================================
# Agent 基础配置
# =====================================================
# 定义 Agent 名称为 agent1，包含一个 source、一个 sink 和一个 channel
agent1.sources = source1
agent1.sinks = sink1
agent1.channels = channel1

# =====================================================
# Source 配置 (source1)
# =====================================================
# 将 source1 绑定到 channel1
agent1.sources.source1.channels = channel1

# Source 类型: spooldir - 监控目录中的新文件
# 注意: 监控的文件被读取后会添加 .COMPLETED 后缀，不会被重复读取
agent1.sources.source1.type = spooldir

# 监控的目录路径 - Flume 会监控此目录下的新文件
agent1.sources.source1.spoolDir = /tmp/spooldir

# =====================================================
# Sink 配置 (sink1)
# =====================================================
# 将 sink1 绑定到 channel1
agent1.sinks.sink1.channel = channel1

# Sink 类型: hdfs - 将数据写入 HDFS
agent1.sinks.sink1.type = hdfs

# HDFS 目标路径 - 数据写入的 HDFS 目录
agent1.sinks.sink1.hdfs.path = /tmp/flume

# 写入 HDFS 的文件前缀
agent1.sinks.sink1.hdfs.filePrefix = events

# 写入 HDFS 的文件后缀（.avro 表示 Avro 格式）
agent1.sinks.sink1.hdfs.fileSuffix = .avro

# HDFS 文件类型: DataStream（不进行序列化，直接写入字节流）
agent1.sinks.sink1.hdfs.fileType = DataStream

# 序列化器: avro_event - 将 Flume 事件序列化为 Avro 格式
agent1.sinks.sink1.serializer = avro_event

# Avro 压缩编解码器: snappy（高效压缩算法，平衡压缩率和速度）
agent1.sinks.sink1.serializer.compressionCodec = snappy

# =====================================================
# Channel 配置 (channel1)
# =====================================================
# Channel 类型: file - 基于文件的可靠 Channel，数据写入磁盘
agent1.channels.channel1.type = file
