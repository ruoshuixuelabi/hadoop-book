# 这是后面几个变体共同的基准版本：把目录里生成的文件落到 HDFS。
# 结构和 spool-to-logger 完全一样，只是把汇从 logger 换成了 hdfs。
agent1.sources = source1
agent1.sinks = sink1
agent1.channels = channel1

agent1.sources.source1.channels = channel1
agent1.sinks.sink1.channel = channel1

agent1.sources.source1.type = spooldir
agent1.sources.source1.spoolDir = /tmp/spooldir

agent1.sinks.sink1.type = hdfs
# 目标路径是输出目录；目录不存在时不必手工先建，Hadoop 客户端在创建文件时会顺带把父目录补出来。
agent1.sinks.sink1.hdfs.path = /tmp/flume
# 前缀和后缀决定写出的文件名，格式是「前缀 + 一个自增序号 + 后缀」，
# 形如 events.1.log、events.2.log；这个序号是 Flume 内部的计数器，不是随机数，
# 它存在的意义是让同一次运行里滚动出来的多个文件彼此不重名。
agent1.sinks.sink1.hdfs.filePrefix = events
agent1.sinks.sink1.hdfs.fileSuffix = .log
# 前缀选项 inUsePrefix 是「正在写、还没写完」的那个临时文件的前缀，
# 用下划线开头是为了和正式文件区分开，避免下游把半截文件当成完整数据读。
# 临时文件还有一个默认后缀 .tmp，写完关闭时 Flume 会把它改名成正式文件。
agent1.sinks.sink1.hdfs.inUsePrefix = _
# 文件类型 DataStream 表示按原始字节流直接写出，不额外加任何包装。
# 行的边界来自序列化器而不是文件类型：默认的 TEXT 序列化器会在每条事件后面补一个换行符。
# 另外两个可选值是 SequenceFile（Hadoop 自己的序列文件格式，带键值和分隔结构）
# 和 CompressedStream（原始字节流，但整体先压缩再写）。
# 注意 DataStream 不能和 hdfs.codeC 同时使用，两者一起配会在启动时直接报错。
agent1.sinks.sink1.hdfs.fileType = DataStream

agent1.channels.channel1.type = file
