# 最简单的 Flume 配置：一个代理（agent）由三部分组成：
# 源（source）负责接收数据，通道（channel）负责暂存，汇（sink）负责写出。
# 这份配置把目录里生成的文件读进来，只打到 Flume 自己的日志里，
# 用途是确认管道本身通了；后面几个变体都在这个三段式骨架上加东西。
#
# 代理的名字可以随便取，这里叫 agent1；一个配置文件里可以写多个代理。
agent1.sources = source1
agent1.sinks = sink1
agent1.channels = channel1

# 下面两行把三段接起来：源接到通道上，汇从通道取数据。
# 事件从源出来先进通道排队，再由汇取走。
agent1.sources.source1.channels = channel1
agent1.sinks.sink1.channel = channel1

# 源类型 spooldir 会监视一个目录，把进来的文件按行读成事件。
# 一个文件读完以后，Flume 会自己在文件名后面补上 .COMPLETED 后缀（就是 fileSuffix 选项的默认值），
# 带上这个后缀的文件下一轮扫描会被跳过，所以生产方只要把写好的文件放进目录，不必自己改名；
# 但文件必须一次写完、名字也不能重复，否则 Flume 会认为前提被破坏而报错停掉。
agent1.sources.source1.type = spooldir
agent1.sources.source1.spoolDir = /tmp/spooldir

# 汇类型 logger 把每条事件打印到 Flume 自己的日志里，不落地。
# 想看清楚管道里到底流过了什么内容时，用它最方便。
agent1.sinks.sink1.type = logger

# 通道类型 file 把事件持久化到磁盘，进程重启后不会丢数据；
# 相比 memory 通道更可靠，代价是多一层磁盘读写。
agent1.channels.channel1.type = file
