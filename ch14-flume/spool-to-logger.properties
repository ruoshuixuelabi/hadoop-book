# =====================================================
# Apache Flume 配置文件： spool-to-logger
# =====================================================
# 文件说明:
#   本配置文件定义了一个最简单的 Flume Agent 配置。
#   用于测试和调试目的：将监控目录中的文件内容输出到日志（logger sink），
#   而不是写入 HDFS。
#
# 工作流程:
#   1. Source (source1): 监控 /tmp/spooldir 目录，检测新文件
#   2. Channel (channel1): 使用 File Channel 暂存事件
#   3. Sink (sink1): 将事件内容输出到日志（用于调试）
#
# 使用场景:
#   - Flume 配置开发和调试
#   - 验证文件读取和事件生成是否正常
#   - 学习 Flume 组件工作原理
#   - 生产环境前的小规模测试
#
# 注意事项:
#   - logger sink 会将事件内容打印到 Flume 日志
#   - 适合验证数据流，但不适合生产数据处理
# =====================================================

# =====================================================
# Agent 基础配置
# =====================================================
# 定义 Agent 名称为 agent1，包含一个 source、一个 sink 和一个 channel
agent1.sources = source1
agent1.sinks = sink1
agent1.channels = channel1

# =====================================================
# Source 配置 (source1)
# =====================================================
# 将 source1 绑定到 channel1
agent1.sources.source1.channels = channel1

# 将 sink1 绑定到 channel1
agent1.sinks.sink1.channel = channel1

# Source 类型: spooldir - 监控目录中的新文件
# 监控的文件被读取后会自动添加 .COMPLETED 后缀，不会被重复读取
agent1.sources.source1.type = spooldir

# 监控的目录路径 - Flume 会监控此目录下的新文件
agent1.sources.source1.spoolDir = /tmp/spooldir

# =====================================================
# Sink 配置 (sink1)
# =====================================================
# Sink 类型: logger - 将事件内容输出到日志（用于调试）
# 注意: logger sink 不会真正写入持久化存储，仅用于测试调试
agent1.sinks.sink1.type = logger

# =====================================================
# Channel 配置 (channel1)
# =====================================================
# Channel 类型: file - 基于文件的可靠 Channel，数据写入磁盘
# 即使 Flume 重启，未处理的数据也不会丢失
agent1.channels.channel1.type = file
