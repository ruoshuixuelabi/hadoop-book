# =====================================================
# Apache Flume 配置文件： spool-to-hdfs-and-logger（双输出配置）
# =====================================================
# 文件说明:
#   本配置文件展示 Flume 的扇出（fan-out）能力：
#   一个 Source 从目录读取数据，同时向两个不同的 Sink 发送数据。
#   - Sink1: 将数据写入 HDFS（持久化存储）
#   - Sink2: 将数据输出到日志（实时监控/调试）
#
# 工作流程:
#   1. Source (source1): 监控 /tmp/spooldir 目录，读取新文件
#   2. Channel 选择器: replicating 模式，将数据复制到所有配置的 Channel
#   3. Channel1a (file): 可靠存储，用于 HDFS 写入
#   4. Channel1b (memory): 内存缓冲，用于日志输出
#   5. Sink1a: 从 Channel1a 消费数据，写入 HDFS
#   6. Sink1b: 从 Channel1b 消费数据，输出到日志
#
# 配置特点:
#   - 使用 selector.type = replicating 实现数据复制
#   - Channel1a 使用 file channel（可靠但速度较慢）
#   - Channel1b 使用 memory channel（快速但不保证可靠性）
#   - selector.optional = channel1b 表示 channel1b 失败不影响整体
#
# 使用场景:
#   - 同时需要实时监控和批量存储的场景
#   - 数据流调试和验证
#   - 审计日志和主数据存储并行
# =====================================================

# =====================================================
# Agent 基础配置
# =====================================================
agent1.sources = source1
agent1.sinks = sink1a sink1b
agent1.channels = channel1a channel1b

# =====================================================
# Source 配置 (source1)
# =====================================================
# 将 Source 绑定到两个 Channel（实现扇出）
agent1.sources.source1.channels = channel1a channel1b

# Channel 选择器类型: replicating（复制模式）
# 每个事件都会被发送到所有配置的 Channel
agent1.sources.source1.selector.type = replicating

# 可选 Channel 配置
# channel1b 标记为 optional，如果此 Channel 失败，不会导致 Source 失败
agent1.sources.source1.selector.optional = channel1b

# Source 类型: spooldir - 监控目录中的新文件
agent1.sources.source1.type = spooldir
agent1.sources.source1.spoolDir = /tmp/spooldir

# =====================================================
# Sink 配置
# =====================================================
# Sink1a: HDFS Sink，将数据写入 HDFS
agent1.sinks.sink1a.channel = channel1a
agent1.sinks.sink1a.type = hdfs
agent1.sinks.sink1a.hdfs.path = /tmp/flume
agent1.sinks.sink1a.hdfs.filePrefix = events
agent1.sinks.sink1a.hdfs.fileSuffix = .log
agent1.sinks.sink1a.hdfs.fileType = DataStream

# Sink1b: Logger Sink，将数据输出到日志（实时监控）
agent1.sinks.sink1b.channel = channel1b
agent1.sinks.sink1b.type = logger

# =====================================================
# Channel 配置
# =====================================================
# Channel1a: File Channel（可靠存储，数据写入磁盘）
# 特点：数据不丢失，但写入速度较慢
agent1.channels.channel1a.type = file

# Channel1b: Memory Channel（内存缓冲）
# 特点：写入速度快，但 Agent 重启时数据可能丢失
# 注意：通常不推荐在生产环境使用 memory channel
agent1.channels.channel1b.type = memory
