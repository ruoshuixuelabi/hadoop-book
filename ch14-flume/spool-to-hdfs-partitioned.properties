# =====================================================
# Apache Flume 配置文件： spool-to-hdfs-partitioned
# =====================================================
# 文件说明:
#   本配置文件定义了另一个带时间戳拦截器的 Flume Agent 配置。
#   与 spool-to-hdfs-avro.properties 类似，但配置更简洁，
#   直接输出为标准文本流格式（.log 后缀）而非 Avro 格式。
#
# 与 spool-to-hdfs-avro.properties 的区别:
#   - 不使用 Avro 序列化，使用原始文本格式
#   - 文件后缀为 .log 而非 .avro
#   - 适合不需要 Avro 反序列化的场景
#
# 工作流程:
#   1. Source (source1): 监控 /tmp/spooldir 目录，检测新文件
#   2. Interceptor: 添加 timestamp 拦截器，为事件添加时间戳
#   3. Channel (channel1): 使用 File Channel 暂存事件
#   4. Sink (sink1): 按时间分区写入 HDFS
#
# 使用方式:
#   $ flume-ng agent -n agent1 -f spool-to-hdfs-partitioned.properties
# =====================================================

# =====================================================
# Agent 基础配置
# =====================================================
agent1.sources = source1
agent1.sinks = sink1
agent1.channels = channel1

# =====================================================
# Source 配置 (source1)
# =====================================================
# 将 source1 绑定到 channel1
agent1.sources.source1.channels = channel1

# 将 sink1 绑定到 channel1
agent1.sinks.sink1.channel = channel1

# Source 类型: spooldir - 监控目录中的新文件
agent1.sources.source1.type = spooldir

# 监控的目录路径 - Flume 会监控此目录下的新文件
agent1.sources.source1.spoolDir = /tmp/spooldir

# =====================================================
# 拦截器配置
# =====================================================
# 为 Source 添加 timestamp 拦截器
# 用于在事件头中添加时间戳，实现时间分区
agent1.sources.source1.interceptors = interceptor1
agent1.sources.source1.interceptors.interceptor1.type = timestamp

# =====================================================
# Sink 配置 (sink1)
# =====================================================
# Sink 类型: hdfs - 将数据写入 HDFS
agent1.sinks.sink1.type = hdfs

# HDFS 路径使用时间变量 - 自动按 年/月/日 分区创建目录
# %Y: 四位年份 (如 2024), %m: 两位月份 (如 01-12), %d: 两位日期 (如 01-31)
agent1.sinks.sink1.hdfs.path = /tmp/flume/year=%Y/month=%m/day=%d

# 写入 HDFS 的文件前缀
agent1.sinks.sink1.hdfs.filePrefix = events

# 写入 HDFS 的文件后缀 (.log 文本格式)
agent1.sinks.sink1.hdfs.fileSuffix = .log

# HDFS 文件类型: DataStream（直接写入文本流，不进行序列化）
agent1.sinks.sink1.hdfs.fileType = DataStream

# =====================================================
# Channel 配置 (channel1)
# =====================================================
# Channel 类型: file - 基于磁盘的可靠 Channel
agent1.channels.channel1.type = file
