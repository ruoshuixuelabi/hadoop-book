# =====================================================
# Hadoop Metrics 配置文件（本地模式）
# =====================================================
# 文件说明:
#   本配置文件使用 Hadoop 旧版 Metrics API (org.apache.hadoop.metrics) 进行指标收集配置。
#   此配置适用于本地模式（local mode）的 Hadoop 环境。
#
# Metrics API 版本说明:
#   - 旧版 API: org.apache.hadoop.metrics - 已过时，但仍有使用
#   - 新版 API: org.apache.hadoop.metrics2 - 推荐使用
#
# 本地模式特点:
#   - 所有指标收集器配置为 NullContext（不收集任何指标）
#   - 适用于不需要指标收集的开发/调试环境
#   - 减少指标收集带来的性能开销
#
# 可用的 Metrics Context 类型:
#   - NullContext: 不收集任何指标（默认配置）
#   - FileContext: 将指标写入本地文件
#   - GangliaContext: 将指标发送到 Ganglia 监控系统
#
# 文件位置: snippet/conf/local/
# =====================================================

# =====================================================
# DFS Metrics 配置（HDFS 指标）
# =====================================================
# dfs.class: Metrics Context 实现类
# 当前配置: NullContext - 不收集 DFS 相关指标

# 配置为不收集指标（默认）
dfs.class=org.apache.hadoop.metrics.spi.NullContext

# 备选配置 - 写入文件方式:
# dfs.class=org.apache.hadoop.metrics.file.FileContext
# dfs.period=10          # 收集周期（秒）
# dfs.fileName=/tmp/dfsmetrics.log  # 指标文件路径

# 备选配置 - Ganglia 方式:
# Ganglia 3.0 版本:
# dfs.class=org.apache.hadoop.metrics.ganglia.GangliaContext
# Ganglia 3.1 版本:
# dfs.class=org.apache.hadoop.metrics.ganglia.GangliaContext31
# dfs.period=10          # 收集周期（秒）
# dfs.servers=localhost:8649  # Ganglia 服务器地址

# =====================================================
# MapReduce Metrics 配置（MapReduce 指标）
# =====================================================
# MapReduce 作业和任务的指标收集配置

# 配置为不收集指标（默认）
mapred.class=org.apache.hadoop.metrics.spi.NullContext

# 备选配置 - 写入文件方式:
# mapred.class=org.apache.hadoop.metrics.file.FileContext
# mapred.period=10
# mapred.fileName=/tmp/mrmetrics.log

# 备选配置 - Ganglia 方式:
# mapred.class=org.apache.hadoop.metrics.ganglia.GangliaContext
# mapred.class=org.apache.hadoop.metrics.ganglia.GangliaContext31
# mapred.period=10
# mapred.servers=localhost:8649

# =====================================================
# JVM Metrics 配置（JVM 指标）
# =====================================================
# Hadoop 各组件的 JVM 相关指标（如内存使用、GC 等）

# 默认不收集指标（注释状态）
#jvm.class=org.apache.hadoop.metrics.spi.NullContext

# 备选配置 - 写入文件方式:
#jvm.class=org.apache.hadoop.metrics.file.FileContext
#jvm.period=10
#jvm.fileName=/tmp/jvmmetrics.log

# 备选配置 - Ganglia 方式:
#jvm.class=org.apache.hadoop.metrics.ganglia.GangliaContext
#jvm.class=org.apache.hadoop.metrics.ganglia.GangliaContext31
#jvm.period=10
#jvm.servers=localhost:8649

# =====================================================
# RPC Metrics 配置（RPC 指标）
# =====================================================
# Hadoop RPC 通信的指标（如 RPC 调用次数、延迟等）

# 配置为不收集指标（默认）
rpc.class=org.apache.hadoop.metrics.spi.NullContext

# 备选配置 - 写入文件方式:
#rpc.class=org.apache.hadoop.metrics.file.FileContext
#rpc.period=10
#rpc.fileName=/tmp/rpcmetrics.log

# 备选配置 - Ganglia 方式:
#rpc.class=org.apache.hadoop.metrics.ganglia.GangliaContext
#rpc.class=org.apache.hadoop.metrics.ganglia.GangliaContext31
#rpc.period=10
#rpc.servers=localhost:8649

# =====================================================
# UGI Metrics 配置（用户组信息指标）
# =====================================================
# 用户认证、组映射相关的指标

# 配置为不收集指标（默认）
ugi.class=org.apache.hadoop.metrics.spi.NullContext

# 备选配置 - 写入文件方式:
#ugi.class=org.apache.hadoop.metrics.file.FileContext
#ugi.period=10
#ugi.fileName=/tmp/ugimetrics.log

# 备选配置 - Ganglia 方式:
#ugi.class=org.apache.hadoop.metrics.ganglia.GangliaContext
#ugi.class=org.apache.hadoop.metrics.ganglia.GangliaContext31
#ugi.period=10
#ugi.servers=localhost:8649
