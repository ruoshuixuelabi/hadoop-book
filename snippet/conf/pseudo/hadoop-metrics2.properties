# =====================================================
# Hadoop Metrics2 配置文件（伪分布式模式）
# =====================================================
# 文件说明:
#   本配置文件使用 Hadoop 新版 Metrics2 API (org.apache.hadoop.metrics2) 进行指标收集配置。
#   此配置适用于伪分布式模式（Pseudo-Distributed Mode）的 Hadoop 环境。
#
# Metrics2 配置语法:
#   格式: [prefix].[source|sink].[instance].[options]
#   - prefix: 通配符（如 *）或特定组件名（如 namenode, datanode）
#   - source|sink: 指定是指标源还是指标接收器
#   - instance: 实例名称
#   - options: 具体选项（如 class, period, filename）
#
# 伪分布式模式配置:
#   - 默认使用 FileSink 输出到文件
#   - 采样周期默认为 10 秒
#   - 可按组件类型输出到不同文件
#
# 文件位置: snippet/conf/pseudo/
# =====================================================

# =====================================================
# 全局默认配置
# =====================================================
# *.sink.file.class: 所有 Sink 使用的默认文件 Sink 类
# FileSink 是 Hadoop 内置的文件指标接收器
*.sink.file.class=org.apache.hadoop.metrics2.sink.FileSink

# *.period: 默认采样周期（秒）
# 所有指标每 10 秒收集和输出一次
*.period=10

# =====================================================
# NameNode 指标配置
# =====================================================
# namenode.sink.file.filename: NameNode 指标输出文件名
# 默认情况下，所有组件的指标都会合并到同一个文件
# 取消注释可单独输出 NameNode 指标:
# namenode.sink.file.filename=namenode-metrics.out

# 为 NameNode 指定特殊的采样周期（8秒）
# 可以覆盖全局的 10 秒周期设置
#namenode.sink.*.period=8

# =====================================================
# DataNode 指标配置
# =====================================================
# 取消注释可单独输出 DataNode 指标:
#datanode.sink.file.filename=datanode-metrics.out

# =====================================================
# JobTracker/TaskTracker 指标配置示例（YARN 之前）
# =====================================================
# 以下示例展示如何将不同上下文（context）的指标写入不同的文件

# 将 JobTracker 的 JVM 指标输出到单独文件:
#jobtracker.sink.file_jvm.context=jvm
#jobtracker.sink.file_jvm.filename=jobtracker-jvm-metrics.out

# 将 JobTracker 的 MapReduce 指标输出到单独文件:
#jobtracker.sink.file_mapred.context=mapred
#jobtracker.sink.file_mapred.filename=jobtracker-mapred-metrics.out

# TaskTracker 指标:
#tasktracker.sink.file.filename=tasktracker-metrics.out

# MapTask 指标:
#maptask.sink.file.filename=maptask-metrics.out

# ReduceTask 指标:
#reducetask.sink.file.filename=reducetask-metrics.out
