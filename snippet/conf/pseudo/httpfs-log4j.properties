# =====================================================
# HttpFS Log4j 日志配置文件（伪分布式模式）
# =====================================================
# 文件说明:
#   本配置文件用于配置 HttpFS（Hadoop HDFS Shell over HTTP）的日志输出。
#   此配置适用于伪分布式模式（Pseudo-Distributed Mode）的 Hadoop 环境。
#
# 与本地模式配置的关系:
#   - 配置内容与 snippet/conf/local/httpfs-log4j.properties 完全相同
#   - 区别在于应用场景：本地模式 vs 伪分布式模式
#   - HttpFS 在两种模式下工作方式相同
#
# HttpFS 简介:
#   - HttpFS 是一个 REST API 网关，提供对 HDFS 的 HTTP 访问
#   - 与 NameNode WebUI 不同，HttpFS 支持完整的 HDFS 操作
#   - 支持文件读写、目录操作、权限管理等功能
#
# 日志文件说明:
#   - httpfs.log: HttpFS 主日志，记录所有 HTTP 操作请求和响应
#   - httpfs-audit.log: 审计日志，记录详细的访问信息（用户、操作、时间等）
#
# 日志格式说明:
#   - 使用 ISO8601 时间戳格式
#   - 包含 MDC 信息：hostname（主机名）、user（用户名）、doAs（代理用户）
#   - 包含 op（操作类型）字段，用于追踪具体操作
#
# 文件位置: snippet/conf/pseudo/
# =====================================================

# =====================================================
# HttpFS 主日志 Appender 配置
# =====================================================
# Appender 类型: DailyRollingFileAppender
# 每天午夜自动创建新的日志文件，保留历史日志
log4j.appender.httpfs=org.apache.log4j.DailyRollingFileAppender

# DatePattern: 日志滚动的时间模式
# '.'yyyy-MM-dd 表示每天午夜（00:00:00）创建新文件
log4j.appender.httpfs.DatePattern='.'yyyy-MM-dd

# 日志文件路径: 由系统属性 httpfs.log.dir 指定
# 如果未指定，默认值为 ${httpfs.home}/logs
log4j.appender.httpfs.File=${httpfs.log.dir}/httpfs.log

# Append: true - 新日志内容追加到现有文件
log4j.appender.httpfs.Append=true

# 日志布局: PatternLayout - 自定义日志格式
log4j.appender.httpfs.layout=org.apache.log4j.PatternLayout

# 日志格式:
# %d{ISO8601}      - ISO8601 格式的时间戳（如 2024-01-15T10:30:00,000）
# %5p             - 日志级别，宽度5（如 INFO, DEBUG）
# %c{1}           - 日志来源类别，仅显示最后一部分类名
# [%X{hostname}]  - 主机名，从 MDC 获取
# [%X{user}:%X{doAs}] - 用户名和代理用户名
# %X{op}          - 操作类型（如 OPEN, CREATE, LISTSTATUS, MKDIRS 等）
# %m%n            - 日志消息和换行符
log4j.appender.httpfs.layout.ConversionPattern=%d{ISO8601} %5p %c{1} [%X{hostname}][%X{user}:%X{doAs}] %X{op} %m%n

# =====================================================
# HttpFS 审计日志 Appender 配置
# =====================================================
# 审计日志用于安全审计和合规性检查
# 记录所有对 HDFS 的访问操作，包括谁在什么时间做了什么操作
log4j.appender.httpfsaudit=org.apache.log4j.DailyRollingFileAppender

# 日期滚动模式与主日志相同
log4j.appender.httpfsaudit.DatePattern='.'yyyy-MM-dd

# 审计日志文件路径
log4j.appender.httpfsaudit.File=${httpfs.log.dir}/httpfs-audit.log

# 追加模式
log4j.appender.httpfsaudit.Append=true

# 审计日志布局
log4j.appender.httpfsaudit.layout=org.apache.log4j.PatternLayout

# 审计日志格式（不含操作结果消息）
log4j.appender.httpfsaudit.layout.ConversionPattern=%d{ISO8601} %5p [%X{hostname}][%X{user}:%X{doAs}] %X{op} %m%n

# =====================================================
# 日志级别配置
# =====================================================
# 审计日志器: 级别 INFO，输出到 httpfsaudit appender
# 审计日志通常总是开启的，用于追踪所有操作
log4j.logger.httpfsaudit=INFO, httpfsaudit

# HttpFS 服务器主日志: 级别 INFO，输出到 httpfs appender
# 记录 HttpFS 服务器的所有活动
log4j.logger.org.apache.hadoop.fs.http.server=INFO, httpfs

# HttpFS 库日志: 级别 INFO，输出到 httpfs appender
# 包括认证、加密、故障恢复等底层功能
log4j.logger.org.apache.hadoop.lib=INFO, httpfs
