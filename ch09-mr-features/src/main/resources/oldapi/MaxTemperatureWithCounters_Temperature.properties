# =====================================================
# 最大温度计数器配置文件 (旧版 MapReduce API)
# =====================================================
# 文件说明:
#   本配置文件是旧版 MapReduce API (org.apache.hadoop.mapred) 版本的计数器配置。
#   与新版 API 配置完全相同，用于 MaxTemperatureWithCounters 旧版实现。
#
# 与新版配置的区别:
#   - 路径位于 oldapi/ 子目录下，表明使用旧版 MapReduce API
#   - 功能与主目录下的配置完全一致
#   - 旧版 API 使用 org.apache.hadoop.mapred.JobConf 配置作业
#
# 使用场景:
#   - MaxTemperatureWithCounters 旧版 API 实现
#   - 演示从旧版 API 迁移的示例代码
#   - 兼容需要使用旧版 API 的遗留系统
#
# 计数器说明:
#   - CounterGroupName: 计数器组的总名称
#   - MISSING: 统计缺失温度值的记录数量
#   - MALFORMED: 统计格式错误的记录数量
# =====================================================

# 计数器组的名称，所有温度相关计数器都属于此组
CounterGroupName=Air Temperature Records

# 缺失温度计数器 - 记录温度值缺失或为空的记录数
MISSING.name=Missing

# 格式错误计数器 - 记录格式不符合规范的记录数
MALFORMED.name=Malformed
