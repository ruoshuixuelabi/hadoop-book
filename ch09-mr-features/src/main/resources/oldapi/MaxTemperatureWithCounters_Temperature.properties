# 这份文件是旧版 mapred API 的 MaxTemperatureWithCounters 作业里
# Temperature 计数器分组的「显示名」资源包。
# Hadoop 靠 ResourceBundles.getBundle(bundleName) 去找显示名，
# 而 bundleName 由枚举的宿主类全名加枚举名构成：
# 宿主类 oldapi.MaxTemperatureWithCounters 加枚举 Temperature 得到
# oldapi.MaxTemperatureWithCounters$Temperature，
# getBundle 把 $ 换成 _，并把包里的 . 当成目录分隔符，
# 于是就对应到本文件 oldapi/MaxTemperatureWithCounters_Temperature.properties。
# 上一层目录里那份是给新版 API 的同名类用的，两者内容一致，只是 bundle 路径不同。
# 下面这个键指定计数器分组 Temperature 在作业页面上显示的名字。
# 取不到这一项时，框架会直接显示枚举名本身，也就是 Temperature。
CounterGroupName=Air Temperature Records
# 单个计数器的显示名：键是「枚举常量名 + .name」。
# 枚举常量 MISSING 对应键 MISSING.name，显示成 Missing。
# 计数器的实际名字（MISSING）永远不变，改的只是页面上给人看的字样。
MISSING.name=Missing
MALFORMED.name=Malformed