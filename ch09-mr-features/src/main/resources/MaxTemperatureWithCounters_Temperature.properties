# 这份文件是 MaxTemperatureWithCounters 作业里 Temperature 计数器分组的「显示名」资源包。
# Hadoop 靠 ResourceBundles.getBundle(bundleName) 去找显示名，
# 而 bundleName 由枚举的宿主类名加枚举名构成：
# 宿主类 MaxTemperatureWithCounters 加枚举 Temperature 得到
# MaxTemperatureWithCounters$Temperature，getBundle 会把 $ 换成 _，
# 于是就对应到本文件 MaxTemperatureWithCounters_Temperature.properties。
# 上一层 oldapi 目录里那份给旧版 mapred API 的同名类用，
# 因为那一版的宿主类全名带 oldapi 包前缀，bundle 路径也就多了一层目录。
# 下面这个键指定计数器分组 Temperature 在作业页面上显示的名字。
# 取不到这一项时，框架会直接显示枚举名本身，也就是 Temperature。
CounterGroupName=Air Temperature Records
# 单个计数器的显示名：键是「枚举常量名 + .name」。
# 枚举常量 MISSING 对应键 MISSING.name，显示成 Missing。
# 计数器的实际名字（MISSING）永远不变，改的只是页面上给人看的字样。
MISSING.name=Missing
MALFORMED.name=Malformed