# =====================================================
# 最大温度计数器配置文件 (MaxTemperatureWithCounters)
# =====================================================
# 文件说明:
#   本配置文件用于定义 MapReduce 作业中气象数据质量验证的计数器名称。
#   这些计数器用于统计温度记录数据中的各种异常情况，帮助识别数据质量问题。
#
# 使用场景:
#   - MaxTemperatureWithCounters MapReduce 程序读取气象数据时
#   - 用于验证 NOAA 气象数据集中缺失或格式错误的记录
#   - 配合 -D temperature.options=... 参数指定此配置文件路径
#
# 计数器说明:
#   - CounterGroupName: 计数器组的总名称，用于归类所有温度相关的计数器
#   - MISSING: 统计缺失温度值的记录数量（温度字段为空或无法解析）
#   - MALFORMED: 统计格式错误的记录数量（记录行不符合预期格式）
# =====================================================

# 计数器组的名称，所有温度相关计数器都属于此组
CounterGroupName=Air Temperature Records

# 缺失温度计数器 - 记录温度值缺失或为空的记录数
MISSING.name=Missing

# 格式错误计数器 - 记录格式不符合规范的记录数
MALFORMED.name=Malformed
